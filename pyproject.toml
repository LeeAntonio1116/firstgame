[tool.ruff]
# 단일 출처: 본 파일. CLAUDE.md § 코딩 룰에서 명령 한 줄로 참조.
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "migrations",
    "static",
    "templates",
]

[tool.ruff.lint]
# 룰셋 (사용자 결정 2026-05-28): E·F·I·B·UP·SIM
#   E   = pycodestyle errors (문법 유사)
#   F   = pyflakes (미사용 import 등 명백한 버그)
#   I   = isort (import 정렬)
#   B   = flake8-bugbear (잠재적 버그 패턴)
#   UP  = pyupgrade (옛 문법 → 신문법)
#   SIM = flake8-simplify (불필요하게 복잡한 코드)
select = ["E", "F", "I", "B", "UP", "SIM"]
# 한국어 주석 길이 여유 + 한 줄 SQL 등 일부 케이스에서 E501 (line too long) 완화
# Ruff format이 처리할 수 있는 길이 위반은 자동 정렬되므로 lint에서는 무시
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "routers"]

[tool.ruff.format]
# Ruff 포매터는 Black 호환 기본값 사용 (큰따옴표, 들여쓰기 4칸)
quote-style = "double"
indent-style = "space"

[tool.bandit]
# B311(표준 random 난수)은 게임 확률 로직(dice·market·npcs·batch·character)에 의도적으로 사용 —
# 보안/암호 용도 아님. 암호 난수가 필요한 OTP·토큰은 secrets 모듈 사용(admin_otp.py).
# 실행: bandit -c pyproject.toml -r engine routers main.py config.py database.py
skips = ["B311"]
