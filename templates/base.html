<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}삼국지 길드{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 2rem; width: 100%; max-width: 400px; }
    h1 { color: #e94560; text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #a0a0b0; }
    input { width: 100%; padding: 0.6rem 0.8rem; background: #0f3460; border: 1px solid #1a4a7a; border-radius: 4px; color: #e0e0e0; font-size: 1rem; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #e94560; }
    button { width: 100%; padding: 0.7rem; background: #e94560; border: none; border-radius: 4px; color: #fff; font-size: 1rem; cursor: pointer; font-family: inherit; }
    button:hover { background: #c73652; }
    .error { background: #3a1020; border: 1px solid #e94560; color: #ff6b8a; padding: 0.6rem 0.8rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
    .success { background: #0a3020; border: 1px solid #2ecc71; color: #2ecc71; padding: 0.6rem 0.8rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
    .link-row { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #a0a0b0; }
    .link-row a { color: #e94560; text-decoration: none; }
    .link-row a:hover { text-decoration: underline; }
  </style>
  {% block extra_styles %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
