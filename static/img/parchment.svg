<?xml version="1.0" encoding="UTF-8"?>
<!--
  양피지 텍스처 — 묵빛 군막 컨셉
  자산 정책: SVG only, 처음부터 완성도. "임시→교체" 마인드 없음.
  두 레이어 합성:
    [base] feTurbulence 거친 얼룩 (baseFrequency 0.015, 3 octaves) — 자연스러운 명도 흐름
    [grain] feTurbulence 미세 결 (baseFrequency 0.9, 2 octaves) — 종이 표면 grain
  .panel-card·.modal-card 의 background-image (background-blend-mode: overlay) 로 사용.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <!-- 거친 얼룩 — 큰 명도 흐름 (양피지 빛바램·물자국 느낌) -->
    <filter id="parchment-blotch" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.20
                                           0 0 0 0 0.15
                                           0 0 0 0 0.10
                                           0 0 0 0.18 0"/>
    </filter>

    <!-- 미세 결 — 종이 표면 grain noise -->
    <filter id="parchment-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.32
                                           0 0 0 0 0.26
                                           0 0 0 0 0.18
                                           0 0 0 0.22 0"/>
    </filter>

    <!-- 중간 결 — 미세함과 큰 흐름 사이의 brigde 레이어 -->
    <filter id="parchment-fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.28
                                           0 0 0 0 0.22
                                           0 0 0 0 0.14
                                           0 0 0 0.10 0"/>
    </filter>
  </defs>

  <!-- 합성 순서: blotch → fiber → grain. 위로 갈수록 미세 -->
  <rect width="100%" height="100%" filter="url(#parchment-blotch)"/>
  <rect width="100%" height="100%" filter="url(#parchment-fiber)" opacity="0.7"/>
  <rect width="100%" height="100%" filter="url(#parchment-grain)" opacity="0.85"/>
</svg>
